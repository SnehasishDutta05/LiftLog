<div class="dashboard-shell">

  <!-- =====================================================
       DESKTOP SIDEBAR
  ====================================================== -->

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-logo">
        P
      </div>

      <div class="brand-copy">
        <strong>PulseOS</strong>
        <span>Your fitness companion</span>
      </div>

    </div>


    <nav class="desktop-nav">

      <button
        class="desktop-nav-item active"
        type="button"
      >
        <span class="nav-symbol home-symbol"></span>
        <span>Home</span>
      </button>

      <button
        class="desktop-nav-item"
        type="button"
      >
        <span class="nav-symbol workout-symbol"></span>
        <span>Workouts</span>
      </button>

      <button
        class="desktop-nav-item"
        type="button"
      >
        <span class="nav-symbol progress-symbol"></span>
        <span>Progress</span>
      </button>

      <button
        class="desktop-nav-item"
        type="button"
      >
        <span class="nav-symbol goals-symbol"></span>
        <span>Goals</span>
      </button>

      <button
        class="desktop-nav-item"
        type="button"
      >
        <span class="nav-symbol profile-symbol"></span>
        <span>Profile</span>
      </button>

    </nav>

  </aside>


  <!-- =====================================================
       MAIN CONTENT
  ====================================================== -->

  <main class="dashboard-main">

    <!-- MOBILE HEADER -->

    <header class="mobile-header">

      <div class="mobile-brand">

        <div class="mobile-logo">
          P
        </div>

        <div>
          <strong>PulseOS</strong>
          <span>Your fitness companion</span>
        </div>

      </div>

      <button
        class="profile-avatar"
        type="button"
        aria-label="Profile"
      >
        P
      </button>

    </header>


    <!-- DESKTOP AVATAR -->

    <div class="desktop-profile-row">

      <button
        class="profile-avatar"
        type="button"
        aria-label="Profile"
      >
        P
      </button>

    </div>


    <div class="dashboard-content">

      <!-- =================================================
           WORKOUT TITLE
      ================================================== -->

      <section class="workout-section">

        <div class="workout-title-row">

          <h1>Workout</h1>

          <button
            class="dropdown-button"
            type="button"
            aria-label="Workout options"
          >
            <span></span>
          </button>

        </div>


        <!-- =================================================
             START EMPTY WORKOUT
        ================================================== -->

        <button
          class="start-empty-workout"
          type="button"
          (click)="startEmptyWorkout()"
        >

          <span class="plus-icon">
            <span class="plus-horizontal"></span>
            <span class="plus-vertical"></span>
          </span>

          <span class="start-empty-label">
            Start Empty Workout
          </span>

        </button>


        <!-- =================================================
             ROUTINES
        ================================================== -->

        <div class="section-title">
          <h2>My Routines</h2>
        </div>


        <div class="routine-list">

          @for (routine of routines; track routine.name) {

            <article class="routine-card">

              <div class="routine-left">

                <div
                  class="routine-badge"
                  [class]="routine.className"
                >
                  {{ routine.shortName }}
                </div>

                <div class="routine-copy">
                  <h3>{{ routine.name }}</h3>
                  <p>{{ routine.description }}</p>
                </div>

              </div>


              <button
                class="start-routine-button"
                type="button"
                (click)="startRoutine(routine)"
              >

                <span class="routine-plus">
                  +
                </span>

                <span>
                  Start now
                </span>

              </button>

            </article>

          }

        </div>

      </section>


      <!-- =================================================
           PROGRESS
      ================================================== -->

      <section class="progress-section">

        <div class="section-title">
          <h2>Progress</h2>
        </div>


        <div class="progress-grid">

          <article class="progress-card">

            <span class="progress-label">
              Workouts
            </span>

            <strong>
              0
            </strong>

            <span class="progress-description">
              This week
            </span>

          </article>


          <article class="progress-card">

            <span class="progress-label">
              Volume
            </span>

            <strong>
              0 kg
            </strong>

            <span class="progress-description">
              This week
            </span>

          </article>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       MOBILE BOTTOM NAV
  ====================================================== -->

  <nav class="mobile-bottom-nav">

    <button
      class="mobile-nav-item active"
      type="button"
    >
      <span class="mobile-nav-icon home-symbol"></span>
      <span>Home</span>
    </button>

    <button
      class="mobile-nav-item"
      type="button"
    >
      <span class="mobile-nav-icon workout-symbol"></span>
      <span>Workouts</span>
    </button>

    <button
      class="mobile-nav-item"
      type="button"
    >
      <span class="mobile-nav-icon progress-symbol"></span>
      <span>Progress</span>
    </button>

    <button
      class="mobile-nav-item"
      type="button"
    >
      <span class="mobile-nav-icon profile-symbol"></span>
      <span>Profile</span>
    </button>

  </nav>

</div>
