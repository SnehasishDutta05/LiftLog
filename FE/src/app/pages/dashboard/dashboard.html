<div class="dashboard-shell">

  <main class="dashboard-main">

    <div class="dashboard-content">

      <section class="workout-section">

        <!-- ===============================================
             WORKOUT HEADER
        ================================================ -->

        <div class="workout-title-row">

          <h1>
            Workout
          </h1>

          <p>
            Ready when you are 💪
          </p>

        </div>


        <!-- ===============================================
             START EMPTY WORKOUT
        ================================================ -->

        <button
          class="start-empty-workout"
          type="button"
          (click)="startEmptyWorkout()"
        >

          <span class="start-empty-plus">

            <span class="plus-icon">

              <span class="plus-horizontal"></span>
              <span class="plus-vertical"></span>

            </span>

          </span>


          <span class="start-empty-copy">

            <strong>
              Start Empty Workout
            </strong>

            <span>
              Build your session as you go
            </span>

          </span>


          <!-- Decorative only -->
          <span
            class="workout-decoration"
            aria-hidden="true"
          >
            <span class="dumbbell">

              <span class="dumbbell-weight dumbbell-weight-left"></span>

              <span class="dumbbell-bar"></span>

              <span class="dumbbell-weight dumbbell-weight-right"></span>

            </span>
          </span>

        </button>


        <!-- ===============================================
             MY ROUTINES
        ================================================ -->

        <div class="section-title">

          <h2>
            My Routines
          </h2>


          <span
            class="routine-count"
            [attr.aria-label]="routines.length + ' routines'"
          >
            {{ routines.length }}
          </span>

        </div>


        <!-- ===============================================
             ROUTINE LIST
        ================================================ -->

        <div class="routine-list">

          @for (
            routine of routines;
            track routine.routine_id
          ) {

            <article class="routine-card">

              <div class="routine-left">

                <!--
                  Keep the existing original routine initials.
                  No exercise images are introduced.
                -->

                <div
                  class="routine-badge"
                  [class]="routine.className"
                >
                  {{ routine.shortName }}
                </div>


                <div class="routine-copy">

                  <h3>
                    {{ routine.name }}
                  </h3>

                  <p>
                    {{ routine.description }}
                  </p>

                </div>

              </div>


              <div class="routine-actions">

                <button
                  class="start-routine-button"
                  type="button"
                  [disabled]="routine.isDeleting"
                  (click)="startRoutine(routine)"
                >

                  <span
                    class="routine-plus"
                    aria-hidden="true"
                  >
                    +
                  </span>

                  <span>
                    Start now
                  </span>

                </button>


                <button
                  class="delete-routine-button"
                  type="button"
                  aria-label="Delete routine"
                  [disabled]="routine.isDeleting"
                  (click)="deleteRoutine(routine)"
                >

                  @if (routine.isDeleting) {

                    <span class="delete-loader"></span>

                  } @else {

                    <svg
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path d="M4 7h16"></path>
                      <path d="M9 7V4h6v3"></path>
                      <path d="M6.5 7l1 13h9l1-13"></path>
                      <path d="M10 11v5"></path>
                      <path d="M14 11v5"></path>
                    </svg>

                  }

                </button>

              </div>

            </article>

          }

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       BOTTOM NAVIGATION
  ====================================================== -->

  <nav class="mobile-bottom-nav">

    <button
      class="mobile-nav-item"
      type="button"
    >

      <span class="nav-icon-circle emoji-icon">
        🏠
      </span>

      <span class="nav-label">
        Home
      </span>

    </button>


    <button
      class="mobile-nav-item active"
      type="button"
    >

      <span class="nav-icon-circle emoji-icon">
        🏋️
      </span>

      <span class="nav-label">
        Workouts
      </span>

    </button>


    <button
      class="mobile-nav-item"
      type="button"
      (click)="goToHealthify()"
    >

      <span class="nav-icon-circle emoji-icon">
        🥗
      </span>

      <span class="nav-label">
        Nutrition
      </span>

    </button>


    <button
      class="mobile-nav-item"
      type="button"
      (click)="goToProfile()"
    >

      <span class="nav-icon-circle emoji-icon">
        👤
      </span>

      <span class="nav-label">
        Profile
      </span>

    </button>

  </nav>

</div>


<!-- ========================================================
     DELETE ROUTINE CONFIRMATION
========================================================= -->

@if (showDeleteRoutineDialog) {

  <app-confirm-dialog
    icon="🗑️"
    title="Delete Routine?"
    [message]="
      'Delete &quot;' +
      (pendingDeleteRoutine?.name || 'this routine') +
      '&quot;? This cannot be undone.'
    "
    confirmText="Delete"
    cancelText="Cancel"
    (confirmed)="confirmDeleteRoutine()"
    (cancelled)="cancelDeleteRoutine()"
  />

}
