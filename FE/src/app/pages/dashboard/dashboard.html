<div class="dashboard-shell">

  <main class="dashboard-main">

    <div class="dashboard-content">

      <section class="workout-section">

        <!-- ===============================================
             WORKOUT TITLE
        ================================================ -->

        <div class="workout-title-row">

          <h1>
            Workout
          </h1>

        </div>


        <!-- ===============================================
             START EMPTY WORKOUT
        ================================================ -->

        <button
          class="start-empty-workout"
          type="button"
          (click)="startEmptyWorkout()"
        >

          <span class="plus-icon">

            <span class="plus-horizontal"></span>
            <span class="plus-vertical"></span>

          </span>


          <span class="start-empty-label">
            Start Empty Workout
          </span>

        </button>


        <!-- ===============================================
             MY ROUTINES
        ================================================ -->

        <div class="section-title">

          <h2>
            My Routines
          </h2>

        </div>


        <div class="routine-list">

          @for (
            routine of routines;
            track routine.routine_id
          ) {

            <article class="routine-card">

              <div class="routine-left">

                <div
                  class="routine-badge"
                  [class]="routine.className"
                >
                  {{ routine.shortName }}
                </div>


                <div class="routine-copy">

                  <h3>
                    {{ routine.name }}
                  </h3>

                  <p>
                    {{ routine.description }}
                  </p>

                </div>

              </div>


              <div class="routine-actions-inline">

                <button
                  class="start-routine-button"
                  type="button"
                  [disabled]="routine.isDeleting"
                  (click)="startRoutine(routine)"
                >

                  <span class="routine-plus">
                    +
                  </span>

                  <span>
                    Start now
                  </span>

                </button>


                <button
                  class="delete-routine-button"
                  type="button"
                  aria-label="Delete routine"
                  [disabled]="routine.isDeleting"
                  (click)="deleteRoutine(routine)"
                >

                  @if (routine.isDeleting) {

                    ...

                  } @else {

                    Delete

                  }

                </button>

              </div>

            </article>

          }

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       BOTTOM NAVIGATION
  ====================================================== -->

  <nav class="mobile-bottom-nav">


    <!-- HOME -->

    <button
      class="mobile-nav-item"
      type="button"
    >

      <span class="nav-icon-circle">

        <svg
          viewBox="0 0 24 24"

          <path
            d="M3.5 10.5L12 3.5l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"
          ></path>
        </svg>

      </span>

      <span class="nav-label">
        Home
      </span>

    </button>


    <!-- WORKOUTS -->

    <button
      class="mobile-nav-item active"
      type="button"
    >

      <span class="nav-icon-circle">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M6 8v8"
          ></path>

          <path
            d="M9 6v12"
          ></path>

          <path
            d="M15 6v12"
          ></path>

          <path
            d="M18 8v8"
          ></path>

          <path
            d="M9 12h6"
          ></path>

          <path
            d="M3.5 10v4"
          ></path>

          <path
            d="M20.5 10v4"
          ></path>

        </svg>

      </span>

      <span class="nav-label">
        Workouts
      </span>

    </button>


    <!-- PROGRESS -->

    <button
      class="mobile-nav-item"
      type="button"
    >

      <span class="nav-icon-circle">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <rect
            x="4"
            y="14"
            width="3"
            height="6"
            rx="1"
          ></rect>

          <rect
            x="10.5"
            y="10"
            width="3"
            height="10"
            rx="1"
          ></rect>

          <rect
            x="17"
            y="5"
            width="3"
            height="15"
            rx="1"
          ></rect>

        </svg>

      </span>

      <span class="nav-label">
        Progress
      </span>

    </button>


    <!-- PROFILE -->

    <button
      class="mobile-nav-item"
      type="button"
      (click)="goToProfile()"
    >

      <span class="nav-icon-circle">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="12"
            cy="8"
            r="3.5"
          ></circle>

          <path
            d="M5 20c.7-4 3.1-6 7-6s6.3 2 7 6"
          ></path>

        </svg>

      </span>

        Profile
      </span>

    </button>

  </nav>

</div>
