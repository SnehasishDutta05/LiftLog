<div class="dashboard-shell">

  <main class="dashboard-main">

    <div class="dashboard-content">

      <section class="workout-section">

        <!-- ===============================================
             WORKOUT TITLE
        ================================================ -->

        <div class="workout-title-row">

          <h1>
            Workout
          </h1>

        </div>


        <!-- ===============================================
             START EMPTY WORKOUT
        ================================================ -->

        <button
          class="start-empty-workout"
          type="button"
          (click)="startEmptyWorkout()"
        >

          <span class="plus-icon">

            <span class="plus-horizontal"></span>
            <span class="plus-vertical"></span>

          </span>


          <span class="start-empty-label">
            Start Empty Workout
          </span>

        </button>


        <!-- ===============================================
             MY ROUTINES
        ================================================ -->

        <div class="section-title">

          <h2>
            My Routines
          </h2>

        </div>


        <div class="routine-list">

          @for (
            routine of routines;
            track routine.routine_id
          ) {

            <article class="routine-card">

              <div class="routine-left">

                <div
                  class="routine-badge"
                  [class]="routine.className"
                >
                  {{ routine.shortName }}
                </div>


                <div class="routine-copy">

                  <h3>
                    {{ routine.name }}
                  </h3>

                  <p>
                    {{ routine.description }}
                  </p>

                </div>

              </div>


              <div class="routine-actions-inline">

                <button
                  class="start-routine-button"
                  type="button"
                  [disabled]="routine.isDeleting"
                  (click)="startRoutine(routine)"
                >

                  <span class="routine-plus">
                    +
                  </span>

                  <span>
                    Start now
                  </span>

                </button>


                <button
                  class="delete-routine-button"
                  type="button"
                  aria-label="Delete routine"
                  [disabled]="routine.isDeleting"
                  (click)="deleteRoutine(routine)"
                >

                  @if (routine.isDeleting) {

                    ...

                  } @else {

                    Delete

                  }

                </button>

              </div>

            </article>

          }

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       BOTTOM NAVIGATION
  ====================================================== -->

  <nav class="mobile-bottom-nav">

  <button
    class="mobile-nav-item"
    type="button"
  >

    <span class="nav-icon-circle emoji-icon">
      🏠
    </span>

    <span class="nav-label">
      Home
    </span>

  </button>


  <button
    class="mobile-nav-item active"
    type="button"
  >

    <span class="nav-icon-circle emoji-icon">
      🏋️
    </span>

    <span class="nav-label">
      Workouts
    </span>

  </button>


  <button
    class="mobile-nav-item"
    type="button"
    (click)="goToHealthify()"
  >

    <span class="nav-icon-circle emoji-icon">
      🥗
    </span>

    <span class="nav-label">
      Nutrition
    </span>

  </button>


  <button
    class="mobile-nav-item"
    type="button"
    (click)="goToProfile()"
  >

    <span class="nav-icon-circle emoji-icon">
      👤
    </span>

    <span class="nav-label">
      Profile
    </span>

  </button>

</nav>

</div>
