<div class="dashboard">

  <!-- Desktop Sidebar -->
  <aside class="desktop-sidebar">

    <div class="sidebar-brand">
      <span class="sidebar-brand-mark">P</span>
      <span class="sidebar-brand-name">PulseOS</span>
    </div>

    <nav class="sidebar-navigation">

      <button class="sidebar-nav-item active" type="button">
        <span class="sidebar-nav-icon">⌂</span>
        <span>Home</span>
      </button>

      <button class="sidebar-nav-item" type="button">
        <span class="sidebar-nav-icon">♢</span>
        <span>Workouts</span>
      </button>

      <button class="sidebar-nav-item" type="button">
        <span class="sidebar-nav-icon">◒</span>
        <span>Progress</span>
      </button>

      <button class="sidebar-nav-item" type="button">
        <span class="sidebar-nav-icon">◇</span>
        <span>Goals</span>
      </button>

      <button class="sidebar-nav-item" type="button">
        <span class="sidebar-nav-icon">○</span>
        <span>Profile</span>
      </button>

    </nav>

  </aside>


  <!-- Main Dashboard -->
  <div class="dashboard-main">

    <!-- Header -->
    <header class="dashboard-header">

      <div class="brand">
        <span class="brand-mark">P</span>
        <span class="brand-name">PulseOS</span>
      </div>

      <button
        class="profile-button"
        type="button"
        aria-label="Profile">
        <span>◯</span>
      </button>

    </header>


    <!-- Main Content -->
    <main class="dashboard-content">

      <!-- Workout Section -->
      <section class="workout-section">

        <div class="section-header">
          <h1>Workout</h1>
        </div>


        <!-- Start Empty Workout -->
        <button
          class="empty-workout-button"
          type="button">

          <span class="plus">+</span>
          <span>Start Empty Workout</span>

        </button>


        <!-- My Routines -->
        <div class="routines">

          <h2>My Routines</h2>

          <div class="routine-list">

            <div class="routine">
              <span class="routine-name">Legs</span>

              <button
                type="button"
                class="start-button">
                + Start now
              </button>
            </div>


            <div class="routine">
              <span class="routine-name">Chest</span>

              <button
                type="button"
                class="start-button">
                + Start now
              </button>
            </div>


            <div class="routine">
              <span class="routine-name">Back</span>

              <button
                type="button"
                class="start-button">
                + Start now
              </button>
            </div>


            <div class="routine">
              <span class="routine-name">Arms</span>

              <button
                type="button"
                class="start-button">
                + Start now
              </button>
            </div>


            <div class="routine">
              <span class="routine-name">Shoulders</span>

              <button
                type="button"
                class="start-button">
                + Start now
              </button>
            </div>

          </div>

        </div>

      </section>
      <!-- Progress Section -->
      <section class="progress-section">

        <div class="section-header">
          <h2>Progress</h2>
        </div>

        <div class="progress-card">

          <div class="progress-card-header">
            <div>
              <span class="progress-label">Weekly Activity</span>
              <span class="progress-value">4 / 5 workouts</span>
            </div>

            <div class="progress-percentage">
              80%
            </div>
          </div>


          <!-- Weekly Activity -->
          <div class="weekly-activity">

            <div class="activity-day completed">
              <span class="activity-dot"></span>
              <span class="activity-label">M</span>
            </div>

            <div class="activity-day completed">
              <span class="activity-dot"></span>
              <span class="activity-label">T</span>
            </div>

            <div class="activity-day">
              <span class="activity-dot"></span>
              <span class="activity-label">W</span>
            </div>

            <div class="activity-day completed">
              <span class="activity-dot"></span>
              <span class="activity-label">T</span>
            </div>

            <div class="activity-day completed">
              <span class="activity-dot"></span>
              <span class="activity-label">F</span>
            </div>

            <div class="activity-day">
              <span class="activity-dot"></span>
              <span class="activity-label">S</span>
            </div>

            <div class="activity-day">
              <span class="activity-dot"></span>
              <span class="activity-label">S</span>
            </div>

          </div>


          <!-- Progress Bar -->
          <div class="progress-bar-container">

            <div class="progress-bar">
              <div class="progress-bar-fill"></div>
            </div>

          </div>

        </div>

      </section>
    </main>

  </div>


  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-navigation">

    <button
      class="nav-item active"
      type="button">

      <span class="nav-icon">⌂</span>
      <span>Home</span>

    </button>


    <button
      class="nav-item"
      type="button">

      <span class="nav-icon">♢</span>
      <span>Workouts</span>

    </button>


    <button
      class="nav-item"
      type="button">

      <span class="nav-icon">◒</span>
      <span>Progress</span>

    </button>


    <button
      class="nav-item"
      type="button">

      <span class="nav-icon">○</span>
      <span>Profile</span>

    </button>

  </nav>

</div>
