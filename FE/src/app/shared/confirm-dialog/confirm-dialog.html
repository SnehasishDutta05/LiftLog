<div
  class="confirm-backdrop"
  (click)="onBackdropClick($event)"
>

  <section
    class="confirm-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
  >

    <!-- Close -->
    <button
      type="button"
      class="close-button"
      aria-label="Close confirmation"
      (click)="cancel()"
    >
      ×
    </button>


    <!-- Icon -->
    <div class="confirm-icon">
      {{ icon }}
    </div>


    <!-- Title -->
    <h2 class="confirm-title">
      {{ title }}
    </h2>


    <!-- Message -->
    <p class="confirm-message">
      {{ message }}
    </p>


    <!-- Actions -->
    <div class="confirm-actions">

      <button
        type="button"
        class="cancel-button"
        (click)="cancel()"
      >
        {{ cancelText }}
      </button>


      <button
        type="button"
        class="confirm-button"
        (click)="confirm()"
      >
        {{ confirmText }}
      </button>

    </div>

  </section>

</div>
